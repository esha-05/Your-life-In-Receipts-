name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate dataset
        run: npm run check-data
      - name: Type-check
        run: npm run typecheck
      - name: Unit + component tests
        run: npm test
      - name: Production build
        run: npm run build
